# Run against hummingbird-mock instead of the real Hummingbird sandbox:
#   mvn spring-boot:run -Dspring-boot.run.profiles=mock          (or --spring.profiles.active=mock)
# The mock listens on :8089 and accepts mock-client / mock-secret. Environment variables still win, so e.g.
# HUMMINGBIRD_BASEURL=http://localhost:9000 points at a mock on another port.
#
# Webhooks: the mock posts to http://localhost:8080/api/webhooks/hummingbird by default. If this backend is not on 8080
# (use --server.port=...), start the mock with --mock.webhook-url=http://localhost:<port>/api/webhooks/hummingbird
# or --mock.webhooks-enabled=false. The secret below matches the mock's default.
hummingbird:
  base-url: ${HUMMINGBIRD_BASEURL:http://localhost:8089}
  client-id: ${HUMMINGBIRD_CLIENT_ID:mock-client}
  client-secret: ${HUMMINGBIRD_CLIENT_SECRET:mock-secret}
  webhook-secret: ${HUMMINGBIRD_WEBHOOK_SECRET:mock-webhook-secret}
