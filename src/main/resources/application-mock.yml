# Run against the embedded mock instead of the real Hummingbird sandbox:
#   mvn spring-boot:run -Dspring-boot.run.profiles=mock          (or SPRING_PROFILES_ACTIVE=mock, e.g. on OpenShift)
# The mock lives inside this application (com.example.alerts.mock) and serves the Hummingbird API under
# /hummingbird-mock, so there is nothing else to start. The client talks to it over loopback HTTP, i.e. through the
# same code path as a real call. Environment variables still win, e.g. HUMMINGBIRD_BASEURL to use another URL.
# server.port is resolved at startup, so --server.port=8090 is picked up; set HUMMINGBIRD_BASEURL if the app is
# reachable on a different port than it listens on.
hummingbird:
  base-url: ${HUMMINGBIRD_BASEURL:http://localhost:${server.port:8080}/hummingbird-mock}
  client-id: ${HUMMINGBIRD_CLIENT_ID:${hummingbird.mock.client-id}}
  client-secret: ${HUMMINGBIRD_CLIENT_SECRET:${hummingbird.mock.client-secret}}
  webhook-secret: ${HUMMINGBIRD_WEBHOOK_SECRET:${hummingbird.mock.webhook-secret}}
  mock:
    enabled: true
